openapi: 3.0.3
info:
  title: EPR Control Plane API application
  version: 1.0.0
  contact:
    name: Sergei Iurzin
    email: jurzin.s@gmail.com
  description: >
    Conference Kapellmeister Core is an API to manage conferences
paths:
  /api/v1/auditoriums:
    get:
      tags:
        - Auditorium
      description: Get list of all auditoriums
      operationId: getAllAuditoriums
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditoriumView"
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          $ref: "#/components/responses/forbidden"
        default:
          $ref: "#/components/responses/internal-server-error"
    post:
      tags:
        - Auditorium
      description: Create an auditorium
      operationId: createAuditorium
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditoriumView"
      responses:
        201:
          $ref: "#/components/responses/created"
        400:
          $ref: "#/components/responses/bad-request"
        401:
          $ref: "#/components/responses/unauthorized"
        403:
          $ref: "#/components/responses/forbidden"
        default:
          $ref: "#/components/responses/internal-server-error"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuditoriumView:
      type: object
      description: Data type representing a list of EPR Categories
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          description: Internal numeric ID
          readOnly: true
        name:
          type: string
          description: Auditorium name/title
          maxLength: 255
  responses:
    created:
      description: >
        Created, the new resource is created ('Location' headers contains newly created resource location URI)
      headers:
        Location:
          schema:
            type: string
            format: uri
          description: Newly created resource location URI
      content: {}
    no-content:
      description: No content, the requested action is successfully finished
      content: {}
    bad-request:
      $ref: 'https://api.swaggerhub.com/domains/smartbear-public/ProblemDetails/1.0.0#/components/responses/BadRequest'
    unauthorized:
      $ref: 'https://api.swaggerhub.com/domains/smartbear-public/ProblemDetails/1.0.0#/components/responses/Unauthorized'
    forbidden:
      $ref: 'https://api.swaggerhub.com/domains/smartbear-public/ProblemDetails/1.0.0#/components/responses/Forbidden'
    not-found:
      $ref: 'https://api.swaggerhub.com/domains/smartbear-public/ProblemDetails/1.0.0#/components/responses/NotFound'
    internal-server-error:
      $ref: 'https://api.swaggerhub.com/domains/smartbear-public/ProblemDetails/1.0.0#/components/responses/ServerError'
