plugins {
    id 'groovy'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.20.0'
}

group = 'com.customer.conference.kapellmeister'
version = '0.0.1-SNAPSHOT'
description = 'Backend solution of a Conference Management System'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    openApiVersion = '3.0.1'
    mapstructVersion = '1.6.3'
    postgresVersion = '42.7.10'
    spockVersion = '2.4-groovy-5.0'
    testcontainerPostgresVersion = '1.21.4'
    testcontainerSpockVersion = '1.21.4'
    restAssuredVersion = '6.0.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openApiVersion}"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly "org.postgresql:postgresql:${postgresVersion}"
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation "org.spockframework:spock-spring:${spockVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainerPostgresVersion}"
    testImplementation "org.testcontainers:spock:${testcontainerSpockVersion}"
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}

compileJava {
    dependsOn 'openApiGenerate'
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/api/spec.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = 'com.customer.conference.kapellmeister.api.controller'
    modelPackage = 'com.customer.conference.kapellmeister.api.model'
    typeMappings = [
            OffsetDateTime: 'Instant',
    ]
    importMappings = [
            'java.time.OffsetDateTime': 'java.time.Instant',
    ]
    configOptions = [
            useSpringBoot3  : 'true',
            useTags         : 'true',
            groupByTags     : 'true',
            interfaceOnly   : 'true',
            dateLibrary     : 'java8',
            generateBuilders: 'true',
            generateConstructorWithAllArgs: 'true',
            openApiNullable : 'false',
            additionalModelTypeAnnotations: '@lombok.With',
    ]
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        xml.outputLocation = file("${layout.buildDirectory.get()}/reports/jacoco.xml")
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            enabled = true
            element = 'CLASS'
            excludes = [
                    'com.customer.conference.kapellmeister.config.*',
                    'com.customer.conference.kapellmeister.api.*',
                    'com.customer.conference.kapellmeister.ConferenceKapellmeisterCoreApplication',
            ]

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.95
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
    }
}
